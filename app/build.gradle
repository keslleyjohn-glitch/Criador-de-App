plugins {
    id 'com.android.application'
}

// O nome do pacote (identidade do app) vem do config.properties,
// que o GitHub preenche sozinho a partir do nome que voce digitar.
def cfg = new Properties()
def arquivoCfg = rootProject.file('config.properties')
if (arquivoCfg.exists()) {
    arquivoCfg.withReader('UTF-8') { cfg.load(it) }
}
def versao = Integer.parseInt(System.getenv('VERSAO') ?: '1')

android {
    namespace 'app.webview'
    compileSdk 35

    defaultConfig {
        applicationId cfg.getProperty('pacote', 'app.site.meuaplicativo')
        minSdk 26
        targetSdk 35
        versionCode versao
        versionName "1.${versao}"
        // Aparelhos 32 bits (TV box) e 64 bits (celular)
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        fixa {
            storeFile file('assinatura.jks')
            storePassword 'criador123'
            keyAlias 'app'
            keyPassword 'criador123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.fixa
            minifyEnabled false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Motor do Firefox (vem dentro do app)
    implementation 'org.mozilla.geckoview:geckoview:135.+'
}
